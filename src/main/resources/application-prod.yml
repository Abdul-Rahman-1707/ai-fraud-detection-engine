spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true

  ai:
    openai:
      chat:
        options:
          model: gpt-4o
          temperature: 0.1

server:
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
    min-response-size: 1024

logging:
  level:
    com.portfolio.frauddetection: INFO
    org.springframework: WARN

app:
  fraud:
    score-threshold: 0.75
    velocity-window-minutes: 5
    max-transactions-per-window: 3
